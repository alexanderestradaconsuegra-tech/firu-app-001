user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=firu_global:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=firu_auth:10m   rate=10r/m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        autoindex off;

        # Global rate limit
        limit_req zone=firu_global burst=30 nodelay;

        # ── Security headers ───────────────────────────────────────
        add_header X-Frame-Options            "DENY"                             always;
        add_header X-Content-Type-Options     "nosniff"                          always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://jyceccbtkritogjzqcma.supabase.co; connect-src 'self' https://jyceccbtkritogjzqcma.supabase.co wss://jyceccbtkritogjzqcma.supabase.co; frame-ancestors 'none'; form-action 'self';"
            always;

        # ── Auth pages — stricter rate limit ───────────────────────
        location ~* ^/(login|oauth-callback)\.html$ {
            limit_req zone=firu_auth burst=5 nodelay;

            # Repeat headers (location block overrides parent add_header)
            add_header X-Frame-Options            "DENY"                             always;
            add_header X-Content-Type-Options     "nosniff"                          always;
            add_header Referrer-Policy            "strict-origin-when-cross-origin"  always;
            add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy
                "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://jyceccbtkritogjzqcma.supabase.co; connect-src 'self' https://jyceccbtkritogjzqcma.supabase.co wss://jyceccbtkritogjzqcma.supabase.co; frame-ancestors 'none'; form-action 'self';"
                always;

            try_files $uri =404;
        }

        # ── Static assets — long-lived cache ──────────────────────
        location ~* \.(css|js|webp|png|jpg|jpeg|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── Block hidden files ─────────────────────────────────────
        location ~ /\. {
            deny all;
            return 404;
        }

        # ── Default ────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
